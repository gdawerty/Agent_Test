name: Agent fix

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number to fix
        required: true
        type: string
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: read
  pull-requests: write

concurrency:
  group: agent-fix-gemini
  queue: max

jobs:
  fix:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issues' &&
        github.event.label.name == 'agent-approved'
      )
    runs-on: ubuntu-latest
    environment:
      name: agent-fix
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install agent dependency
        run: python -m pip install -r requirements.txt

      - name: Install mini agent dependency
        if: vars.AGENT_ENGINE == 'mini'
        run: python -m pip install -r requirements-mini.txt

      - name: Build mini agent sandbox
        if: vars.AGENT_ENGINE == 'mini'
        run: docker build --file Dockerfile.agent --tag agent-fix-sandbox:latest .

      - name: Configure Git
        run: |
          git config user.name "gdawerty"
          git config user.email "aaronluutri@gmail.com"

      - name: Run issue agent
        env:
          GH_TOKEN: ${{ github.token }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6' }}
          AGENT_ENGINE: ${{ vars.AGENT_ENGINE || 'custom' }}
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
        run: python agent.py "$ISSUE_NUMBER" --engine "$AGENT_ENGINE" --max-steps 12
