name: Agent fix

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number to fix
        required: true
        type: string
  issues:
    types: [labeled]

permissions:
  actions: write
  contents: write
  issues: read
  pull-requests: write

concurrency:
  group: agent-fix-${{ github.workflow }}-${{ github.repository }}-${{ github.event.issue.number || inputs.issue_number || github.run_id }}
  queue: max

jobs:
  fix:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issues' &&
        github.event.label.name == 'agent-approved'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: agent-fix
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-mini.txt

      - name: Install agent dependency
        run: python -m pip install -r requirements.txt

      - name: Install mini agent dependency
        if: vars.AGENT_ENGINE == 'mini'
        run: python -m pip install -r requirements-mini.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build test sandbox
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.agent
          tags: agent-fix-sandbox:latest
          load: true
          cache-from: type=gha,scope=agent-fix-sandbox
          cache-to: type=gha,mode=max,scope=agent-fix-sandbox,ignore-error=true

      - name: Configure Git
        run: |
          git config user.name "gdawerty"
          git config user.email "aaronluutri@gmail.com"

      - name: Run issue agent
        env:
          GH_TOKEN: ${{ github.token }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6' }}
          AGENT_MODEL_CHAIN: ${{ vars.AGENT_MODEL_CHAIN || 'openai:gpt-5.4,openai:gpt-5.4-mini,gemini:gemini-3.5-flash-lite' }}
          AGENT_ENGINE: ${{ vars.AGENT_ENGINE || 'custom' }}
          AGENT_MAX_STEPS: ${{ vars.AGENT_MAX_STEPS || '12' }}
          AGENT_SANDBOX_TESTS: '1'
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
        run: python agent.py "$ISSUE_NUMBER" --engine "$AGENT_ENGINE" --max-steps "$AGENT_MAX_STEPS"
